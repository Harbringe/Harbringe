<svg viewBox="0 0 860 372" width="860" height="372" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code','Fira Code','JetBrains Mono','SF Mono',Consolas,'Liberation Mono',Menlo,monospace">
  <title>autoca: bookkeeping on autopilot for Indian CA firms</title>
  <style>
    text { white-space: pre; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .body { animation: rise 0.6s ease-out both; }
    .step { animation: rise 0.45s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .pulse, .body, .step { animation: none; } }
  </style>
  
  <rect x="1" y="1" width="858" height="370" rx="11" fill="#1a1b26" stroke="#414868" stroke-width="1.5"/>
  <path d="M 1 12 A 11 11 0 0 1 12 1 H 848 A 11 11 0 0 1 859 12 V 34 H 1 Z" fill="#16161e"/>
  <line x1="1" y1="34" x2="859" y2="34" stroke="#414868"/>
  <rect x="1" y="34" width="3" height="326" fill="#9ece6a" opacity="0.85"/>
  <circle cx="20" cy="17.5" r="5" fill="#f7768e"/><circle cx="37" cy="17.5" r="5" fill="#e0af68"/><circle cx="54" cy="17.5" r="5" fill="#9ece6a"/>
  <text x="430" y="22" text-anchor="middle" font-size="12" fill="#565f89">~/autoca</text>
  <g class="body">
  <text x="26" y="68" font-size="22" font-weight="bold" fill="#9ece6a">autoca</text>
  <text x="122" y="68" font-size="13" fill="#565f89">★ flagship</text>
  <g transform="translate(669 51)">
    <rect width="165" height="21" rx="10.5" fill="#9ece6a" fill-opacity="0.12" stroke="#9ece6a" stroke-opacity="0.55"/>
    <circle cx="11" cy="10.5" r="3.5" fill="#9ece6a" class="pulse"/>
    <text x="20" y="14.5" font-size="11.5" fill="#9ece6a">MVP · in production</text></g>
  <text x="26" y="94" font-size="15" fill="#c0caf5" font-style="italic">bookkeeping on autopilot for Indian CA firms</text>
  <text x="26" y="115" font-size="12.5" fill="#565f89">bank statements in, approved books and returns out. The CA signs off, the software does the rest.</text>
  <text x="26" y="144" font-size="11.5" fill="#bb9af7" font-weight="bold">PIPELINE</text>
  <g class="step" style="animation-delay:0.25s">
    <circle cx="31" cy="160" r="4" fill="#1a1b26" stroke="#9ece6a" stroke-width="1.5"/>
    <line x1="31" y1="165" x2="31" y2="182" stroke="#414868" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="46" y="164" font-size="12.5"><tspan fill="#e0af68" font-weight="bold">statement.pdf </tspan><tspan fill="#c0caf5">any bank, parsed and proved against its own running balance</tspan></text></g>
  <g class="step" style="animation-delay:0.40s">
    <circle cx="31" cy="187" r="4" fill="#1a1b26" stroke="#9ece6a" stroke-width="1.5"/>
    <line x1="31" y1="192" x2="31" y2="209" stroke="#414868" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="46" y="191" font-size="12.5"><tspan fill="#e0af68" font-weight="bold">classify      </tspan><tspan fill="#c0caf5">rules first, then an LLM that only ever sees pseudonymised data</tspan></text></g>
  <g class="step" style="animation-delay:0.55s">
    <circle cx="31" cy="214" r="4" fill="#1a1b26" stroke="#9ece6a" stroke-width="1.5"/>
    <line x1="31" y1="219" x2="31" y2="236" stroke="#414868" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="46" y="218" font-size="12.5"><tspan fill="#e0af68" font-weight="bold">review        </tspan><tspan fill="#c0caf5">CA queue sorted by confidence; every decision teaches a rule</tspan></text></g>
  <g class="step" style="animation-delay:0.70s">
    <circle cx="31" cy="241" r="4" fill="#1a1b26" stroke="#9ece6a" stroke-width="1.5"/>
    <line x1="31" y1="246" x2="31" y2="263" stroke="#414868" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="46" y="245" font-size="12.5"><tspan fill="#e0af68" font-weight="bold">approve       </tspan><tspan fill="#c0caf5">senior CA signs → immutable journal entry, never edited in place</tspan></text></g>
  <g class="step" style="animation-delay:0.85s">
    <circle cx="31" cy="268" r="4" fill="#9ece6a" stroke="#9ece6a" stroke-width="1.5"/>
    
    <text x="46" y="272" font-size="12.5"><tspan fill="#e0af68" font-weight="bold">file          </tspan><tspan fill="#c0caf5">Tally sync · GSTR-1 / 3B / 2B recon · TDS · payroll · P&amp;L, BS</tspan></text></g>
  <line x1="672" y1="136" x2="672" y2="282" stroke="#414868" stroke-dasharray="3 3"/>
  <text x="690" y="144" font-size="11.5" fill="#bb9af7" font-weight="bold">SCALE</text>
  <text x="690" y="180" font-size="19" font-weight="bold" fill="#7dcfff">~100k</text>
  <text x="690" y="196" font-size="10.5" fill="#565f89">py lines</text>
  <text x="774" y="180" font-size="19" font-weight="bold" fill="#7dcfff">~75k</text>
  <text x="774" y="196" font-size="10.5" fill="#565f89">ts lines</text>
  <text x="690" y="238" font-size="19" font-weight="bold" fill="#7dcfff">2,300+</text>
  <text x="690" y="254" font-size="10.5" fill="#565f89">tests</text>
  <text x="774" y="238" font-size="19" font-weight="bold" fill="#7dcfff">127</text>
  <text x="774" y="254" font-size="10.5" fill="#565f89">migrations</text>
  <text x="26" y="303" font-size="11.5" fill="#bb9af7" font-weight="bold">GUARANTEES</text>
  <rect x="118" y="289" width="161" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="198.5" y="302.5" text-anchor="middle" font-size="11" fill="#9ece6a">postgres RLS per firm</text>
  <rect x="285" y="289" width="161" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="365.5" y="302.5" text-anchor="middle" font-size="11" fill="#9ece6a">no UPDATE on journals</text>
  <rect x="452" y="289" width="126" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="515" y="302.5" text-anchor="middle" font-size="11" fill="#9ece6a">encrypted GSTINs</text>
  <rect x="584" y="289" width="113" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="640.5" y="302.5" text-anchor="middle" font-size="11" fill="#9ece6a">MFA everywhere</text>
  <rect x="26" y="320" width="57" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="54.5" y="333.5" text-anchor="middle" font-size="11" fill="#7dcfff">django</text>
  <rect x="89" y="320" width="71" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="124.5" y="333.5" text-anchor="middle" font-size="11" fill="#7dcfff">postgres</text>
  <rect x="166" y="320" width="71" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="201.5" y="333.5" text-anchor="middle" font-size="11" fill="#7dcfff">react 19</text>
  <rect x="243" y="320" width="57" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="271.5" y="333.5" text-anchor="middle" font-size="11" fill="#7dcfff">celery</text>
  <rect x="306" y="320" width="37" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="324.5" y="333.5" text-anchor="middle" font-size="11" fill="#7dcfff">aws</text>
  <text x="834" y="357" text-anchor="end" font-size="11.5" fill="#565f89">open repo ↗</text>
  </g>
</svg>
