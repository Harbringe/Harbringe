<svg viewBox="0 0 410 258" width="410" height="258" xmlns="http://www.w3.org/2000/svg" font-family="'Cascadia Code','Fira Code','JetBrains Mono','SF Mono',Consolas,'Liberation Mono',Menlo,monospace">
  <title>eo-insight — ask satellite imagery questions in English</title>
  <style>
    text { white-space: pre; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .body { animation: rise 0.6s ease-out both; }
  </style>
  
  <rect x="1" y="1" width="408" height="256" rx="11" fill="#1a1b26" stroke="#414868" stroke-width="1.5"/>
  <path d="M 1 12 A 11 11 0 0 1 12 1 H 398 A 11 11 0 0 1 409 12 V 34 H 1 Z" fill="#16161e"/>
  <line x1="1" y1="34" x2="409" y2="34" stroke="#414868"/>
  <rect x="1" y="34" width="3" height="212" fill="#7dcfff" opacity="0.85"/>
  <circle cx="20" cy="17.5" r="5" fill="#f7768e"/><circle cx="37" cy="17.5" r="5" fill="#e0af68"/><circle cx="54" cy="17.5" r="5" fill="#9ece6a"/>
  <text x="205" y="22" text-anchor="middle" font-size="12" fill="#565f89">~/eo-insight</text>
  <g class="body">
  <text x="22" y="64" font-size="17" font-weight="bold" fill="#7dcfff">eo-insight</text>
  <g transform="translate(302 49)">
