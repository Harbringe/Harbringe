  <text x="22" y="85" font-size="13" fill="#c0caf5" font-style="italic">ask satellite imagery questions in English</text>
  <text x="22" y="111" font-size="12.5" xml:space="preserve"><tspan fill="#7dcfff">›</tspan><tspan fill="#c0caf5"> Sentinel-2 → NDVI change detection</tspan></text>
  <text x="37" y="128" font-size="12.5" fill="#c0caf5">→ BLIP-2 captions</text>
  <text x="22" y="147" font-size="12.5" xml:space="preserve"><tspan fill="#7dcfff">›</tspan><tspan fill="#c0caf5"> CLIP + text vectors in Qdrant,</tspan></text>
  <text x="37" y="164" font-size="12.5" fill="#c0caf5">PostGIS spatial prefilter</text>
  <text x="22" y="183" font-size="12.5" xml:space="preserve"><tspan fill="#7dcfff">›</tspan><tspan fill="#c0caf5"> NL query → bbox + dates → cited answer</tspan></text>
  <rect x="22" y="208" width="64" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="54" y="221.5" text-anchor="middle" font-size="11" fill="#7dcfff">fastapi</text>
  <rect x="92" y="208" width="57" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="120.5" y="221.5" text-anchor="middle" font-size="11" fill="#7dcfff">qdrant</text>
  <rect x="155" y="208" width="64" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="187" y="221.5" text-anchor="middle" font-size="11" fill="#7dcfff">postgis</text>
  <rect x="225" y="208" width="44" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
