  <rect x="275" y="208" width="57" height="19" rx="4" fill="#24283b" stroke="#414868" stroke-width="0.8"/>
    <text x="303.5" y="221.5" text-anchor="middle" font-size="11" fill="#7dcfff">celery</text>
  <text x="22" y="243" font-size="11.5" fill="#565f89"><tspan fill="#9ece6a">$</tspan> next: RemoteCLIP + map UI</text>
